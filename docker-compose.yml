services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: wedding-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: wedding-ai-service
    env_file:
      - ./ai-service/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./ai-service:/app
    depends_on:
      - qdrant
    ports:
      - "8000:8000"

volumes:
  qdrant_data:


